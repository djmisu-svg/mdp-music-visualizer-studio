<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MdP RemiX 1&1 - Music Visualizer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
  padding: 24px;
}

h1 {
  font-size: clamp(25px,6vw,46px);
  margin: 18px 0 8px;
}

p {
  color: #b9c6df;
}

.panel {
  max-width: 850px;
  margin: auto;
}

canvas {
  width: 100%;
  height: 300px;
  display: block;
  background: linear-gradient(#101b35,#050812);
  border-radius: 18px;
  margin: 25px 0;
}

input {
  max-width: 100%;
  margin: 12px;
}

button {
  background: #2675df;
  border: 0;
  border-radius: 10px;
  padding: 13px 24px;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

audio {
  width: 100%;
  margin-top: 20px;
}

#status {
  min-height: 25px;
}
</style>
</head>

<body>

<div class="panel">

<h1>MdP RemiX 1&1</h1>

<p>MUSIC VISUALIZER • DEEP BASS PULSE</p>

<input id="file" type="file" accept="audio/*">

<br>

<button id="start">
▶ Pornește vizualizatorul
</button>

<canvas id="visual"></canvas>

<audio id="audio" controls></audio>

<p id="status">
Alege o melodie de pe dispozitiv.
</p>

</div>

<script>

const canvas = document.getElementById('visual');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('audio');
const status = document.getElementById('status');

let ac;
let analyser;
let source;
let data;
let objectURL;

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}

window.addEventListener('resize', resize);
resize();

document.getElementById('file')
.addEventListener('change', e => {

  const f = e.target.files[0];

  if (!f) return;

  if (objectURL) {
    URL.revokeObjectURL(objectURL);
  }

  objectURL = URL.createObjectURL(f);
  audio.src = objectURL;

  status.textContent =
    'Încărcat: ' + f.name + ' — apasă Pornește.';
});

document.getElementById('start')
.addEventListener('click', async () => {

  if (!audio.src) {
    status.textContent = 'Mai întâi alege o melodie.';
    return;
  }

  try {

    if (!ac) {

      ac = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      analyser = ac.createAnalyser();
      analyser.fftSize = 256;

      source = ac.createMediaElementSource(audio);

      source.connect(analyser);
      analyser.connect(ac.destination);

      data = new Uint8Array(
        analyser.frequencyBinCount
      );
    }

    await ac.resume();
    await audio.play();

    status.textContent = 'Vizualizator activ';

  } catch (e) {

    status.textContent =
      'Nu pot porni melodia: ' + e.message;

  }

});

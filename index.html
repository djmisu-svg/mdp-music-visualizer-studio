
<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MdP RemiX 1&1 Disco Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b19;color:white;font-family:Arial;text-align:center}
main{max-width:1100px;margin:auto;padding:16px}
h1{font-size:clamp(25px,5vw,42px);margin:15px 0 5px}
p{color:#bdc8e3}
.controls,.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}
button{background:#2459bc;color:white;border:1px solid #6a8de1;border-radius:10px;padding:12px;font-size:15px}
button.active{background:#8241bc}
input{max-width:100%;padding:10px}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#090d20;border-radius:12px}
audio{width:100%;margin-top:15px}
#status{min-height:30px}
</style>
</head>
<body>
<main>
<h1>MdP RemiX 1&1</h1>
<p>THE ULTIMATE DISCO VISUALIZER</p>
<div class="controls">
<input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a">
<button id="start">▶ PORNEȘTE DISCO</button>
</div>
<div class="modes">
<button data-mode="disco" class="active">DISCO MEGAMIX</button>
<button data-mode="eq">EGALIZATOARE</button>
<button data-mode="club">FUTURE CLUB</button>
</div>
<canvas id="screen" width="1280" height="720"></canvas>
<audio id="player" controls></audio>
<p id="status">Alege o melodie MP3 sau WAV.</p>
</main>
<script>
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const player=document.getElementById("player");
const file=document.getElementById("file");
const status=document.getElementById("status");
let ac,analyser,source,data,url;
let mode="disco";
let started=false;

document.querySelectorAll("[data-mode]").forEach(b=>{
b.onclick=()=>{
mode=b.dataset.mode;
document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
};
});

file.onchange=()=>{
const f=file.files[0];
if(!f)return;
player.pause();
if(url)URL.revokeObjectURL(url);
url=URL.createObjectURL(f);
player.src=url;
player.load();
status.textContent="Încărcat: "+f.name;
};

player.onloadedmetadata=()=>{
status.textContent="Melodie pregătită: "+Math.floor(player.duration/60)+" minute.";
};

player.onerror=()=>{
status.textContent="Fișierul nu poate fi redat. Încearcă MP3 sau WAV.";
};

document.getElementById("start").onclick=async()=>{
if(!player.src){
status.textContent="Alege mai întâi melodia.";
return;
}
try{
if(!ac){
ac=new(window.AudioContext||window.webkitAudioContext)();
analyser=ac.createAnalyser();
analyser.fftSize=256;
source=ac.createMediaElementSource(player);
source.connect(analyser);
analyser.connect(ac.destination);
data=new Uint8Array(analyser.frequencyBinCount);
}
await ac.resume();
await player.play();
status.textContent="DISCO PORNIT!";
}catch(e){
status.textContent="Eroare redare: "+e.message;
}
};

function dancer(x,y,s,t,energy){
ctx.save();
ctx.translate(x,y-Math.abs(Math.sin(t*2))*energy*15);
ctx.scale(s,s);
ctx.strokeStyle="#6deaff";
ctx.lineWidth=9;
ctx.lineCap="round";
ctx.shadowColor="#ff60d5";
ctx.shadowBlur=15;
ctx.beginPath();
ctx.arc(0,-85,15,0,Math.PI*2);
ctx.stroke();
ctx.beginPath();
ctx.moveTo(0,-70);
ctx.lineTo(0,-25);
ctx.moveTo(0,-55);
ctx.lineTo(-30+Math.sin(t)*18,-38);
ctx.moveTo(0,-55);
ctx.lineTo(30+Math.cos(t)*18,-38);
ctx.moveTo(0,-25);
ctx.lineTo(-20+Math.sin(t)*15,20);
ctx.moveTo(0,-25);
ctx.lineTo(20+Math.cos(t)*15,20);
ctx.stroke();
ctx.restore();
}

function animate(time){
requestAnimationFrame(animate);
const t=time/1000;
const w=canvas.width,h=canvas.height;
ctx.fillStyle="#080c21";
ctx.fillRect(0,0,w,h);
if(data&&analyser)analyser.getByteFrequencyData(data);
const energy=data?data[3]/255:0.15;

for(let i=0;i<10;i++){
let x=i*150+Math.sin(t+i)*80;
ctx.globalAlpha=0.12+energy*0.2;
ctx.fillStyle=`hsl(${i*35+180},100%,60%)`;
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x-150,h);
ctx.lineTo(x+150,h);
ctx.fill();
}
ctx.globalAlpha=1;

const bx=w/2,by=105;
ctx.fillStyle="#b9d8ee";
ctx.shadowColor="#9eeaff";
ctx.shadowBlur=25;
ctx.beginPath();
ctx.arc(bx,by,48,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;
for(let y=-30;y<=30;y+=15){
for(let x=-30;x<=30;x+=15){
if(x*x+y*y<2000){
ctx.fillStyle=(x+y)%30===0?"#ffffff":"#6386b5";
ctx.fillRect(bx+x,by+y,10,10);
}
}
}

ctx.textAlign="center";
ctx.fillStyle="white";
ctx.font="bold 43px Arial";
ctx.fillText("MdP RemiX 1&1",w/2,220);
ctx.font="21px Arial";
ctx.fillText(mode==="disco"?"DISCO MEGAMIX":mode==="eq"?"STEREO EQUALIZER":"FUTURE CLUB",w/2,255);

if(mode==="disco"){
dancer(280,520,1.3,t*2,energy);
dancer(450,540,1.1,t*2.5+1,energy);
dancer(830,540,1.1,t*2.3+2,energy);
dancer(1000,520,1.3,t*2.1+3,energy);
}

if(mode==="club"){
for(let i=0;i<6;i++){
ctx.strokeStyle=`hsl(${i*50+180},100%,60%)`;
ctx.lineWidth=5;
ctx.beginPath();
ctx.arc(130+i*205,450,35+energy*70,0,Math.PI*2);
ctx.stroke();
}
}

for(let side=0;side<2;side++){
for(let i=0;i<12;i++){
const v=data?data[(i+side*20)%data.length]/255:0.12;
ctx.fillStyle=`hsl(${120-i*10},95%,55%)`;
ctx.fillRect(side?1160:100,310+i*17,20+v*65,11);
}
}

const count=72;
for(let i=0;i<count;i++){
let v=data?data[i%data.length]/255:0.1;
let bh=15+v*(mode==="eq"?350:145);
ctx.fillStyle=`hsl(${185+i*2.5},95%,60%)`;
ctx.fillRect(i*w/count+2,h-bh,w/count-4,bh);
}
}
requestAnimationFrame(animate);
</script>
</body>
</html>
